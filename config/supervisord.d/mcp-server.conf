# The official Blender MCP server (blmcp), over HTTP on loopback. Not in the watchdog's
# list: a crash here is retried, and Blender with its open scene keeps running meanwhile.
[program:mcp-server]
command=/etc/code-docker-blender/mcp-server-service.sh
priority=50
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
