# autorestart=true, and deliberately NOT in critical-watchdog's list: quitting Blender is
# an ordinary thing for a person at the VNC session to do. Bringing it straight back is
# what "there is always a Blender here" means; tearing the container down over it would
# make the GUI a trap. The scene does not survive a restart - only what was saved to
# BLENDER_WORK_DIR does, which is why the MCP notice tells agents to save.
[program:blender]
command=/etc/code-docker-blender/blender-service.sh
priority=40
autorestart=true
# Blender takes a few seconds to come up on a cold start; supervisord's default of 1s
# would call a slow start a failure.
startsecs=5
stopwaitsecs=15
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
