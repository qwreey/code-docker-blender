# Caddy in front of mcp-server: bearer token, and the only listener on
# code-docker-internal. See mcp-gate-service.sh and config/mcp/Caddyfile.
[program:mcp-gate]
command=/etc/code-docker-blender/mcp-gate-service.sh
priority=50
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
