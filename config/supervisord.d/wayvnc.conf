# autorestart=false + startretries=0: a first failure surfaces to critical-watchdog,
# which takes the container down, instead of being retried into a crash loop. Nothing
# can be fixed from inside once the compositor or the VNC server is gone.
[program:wayvnc]
command=/etc/code-docker-blender/wayvnc-service.sh
priority=30
autorestart=false
startretries=0
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
